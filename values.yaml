# values.yaml
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      group_by: ['alertname', 'namespace', 'instance', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 5m
      receiver: 'Slack'
      routes:
      - receiver: 'Slack'
      #   matchers:
      #     - alertname = "Watchdog"      if you want to receive watchdog alerts
      # - receiver: 'Slack'
      #   matchers:
      #     - alertname = "TargetDown"      if you want to receive target down alerts specific to a namespace
    receivers:
    - name: 'Slack'
      slack_configs:
      - slack_channel: '#observability-alerts'
        send_resolved: true
        title: '{{ template "slack.alert.title" . }}'
        text: '{{ template "slack.alert.text" . }}'
        color: '{{ template "slack.alert.color" . }}'
    templates:
    - '/etc/alertmanager/config/*.tmpl'
    - '/etc/alertmanager/config/alerts-template.tmpl'


additionalPrometheusRules:
- '/etc/prometheus/rules/java-rules.yaml'

